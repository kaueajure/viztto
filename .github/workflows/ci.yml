name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: viztto_testes
          MYSQL_USER: viztto
          MYSQL_PASSWORD: viztto_ci
          MYSQL_ROOT_PASSWORD: root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uviztto -pviztto_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      BANCO_HOST: 127.0.0.1
      BANCO_PORTA: 3306
      BANCO_NOME: viztto_testes
      BANCO_USUARIO: viztto
      BANCO_SENHA: viztto_ci
      SEGREDO_SESSAO: segredo-ci-viztto-com-mais-de-trinta-e-dois-caracteres
      URL_APLICACAO: http://localhost:5173
      DIRETORIO_UPLOADS: ./uploads/temporarios
      TAMANHO_MAXIMO_IMAGEM_MB: 15
      COOKIE_SEGURO: false
      CONFIAR_PROXY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Integration tests
        run: npm test
      - name: Build
        run: npm run build
